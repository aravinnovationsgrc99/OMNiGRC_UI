<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" role="img" aria-label="OMNiGRC icon">
  <defs>
    <linearGradient id="g-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5D060"/>
      <stop offset="50%" stop-color="#E8A820"/>
      <stop offset="100%" stop-color="#F5D060"/>
    </linearGradient>
    <linearGradient id="g-teal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#40E0C0"/>
      <stop offset="100%" stop-color="#0F8E7A"/>
    </linearGradient>
    <linearGradient id="g-arrow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F8E7A"/>
      <stop offset="100%" stop-color="#40E0C0"/>
    </linearGradient>
    <filter id="f-glow">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#C88A10" flood-opacity="0.35"/>
    </filter>
    <filter id="f-teal">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F8E7A" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Ring arc (open bottom-right) -->
  <path
    d="M 24 4 A 18 18 0 1 1 38.5 36"
    stroke="url(#g-gold)"
    stroke-width="3.5"
    stroke-linecap="round"
    fill="none"
    filter="url(#f-glow)"
  />

  <!-- Teal swoosh + arrow -->
  <path
    d="M 12 33 Q 22 24 32 15 Q 37 11 42 8"
    stroke="url(#g-arrow)"
    stroke-width="1.6"
    stroke-linecap="round"
    fill="none"
    filter="url(#f-teal)"
  />
  <polygon points="42,8 37,7.5 39.5,12" fill="#40E0C0"/>

  <!-- Bar chart (teal) -->
  <g fill="url(#g-teal)" filter="url(#f-teal)">
    <rect x="17" y="25" width="2.8" height="10" rx="1"/>
    <rect x="21" y="21" width="2.8" height="14" rx="1"/>
    <rect x="25" y="17" width="2.8" height="18" rx="1"/>
    <rect x="29" y="13" width="2.8" height="22" rx="1"/>
  </g>
</svg>
